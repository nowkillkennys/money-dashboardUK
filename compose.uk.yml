name: money-dashboard-uk
services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile.uk
      target: preview
    environment:
      UK_DEMO_ONLY: "true"
      NEXT_PUBLIC_UK_DEMO_ONLY: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/London
    networks: [isolated]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD,node,-e,"fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  ingress:
    image: nginx:alpine
    user: "101:101"
    ports:
      - "127.0.0.1:13021:8080"
    volumes:
      - ./scripts/uk-preview-nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [isolated,edge]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    depends_on:
      preview:
        condition: service_healthy
    healthcheck:
      test: [CMD,wget,-q,--spider,http://127.0.0.1:8080/demo]
      interval: 5s
      timeout: 3s
      retries: 20
  browser-test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.uk
      target: browser-test
    environment:
      PLAYWRIGHT_BASE_URL: http://preview:3000
    networks: [isolated]
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      preview:
        condition: service_healthy
networks:
  isolated:
    internal: true
  edge: {}
